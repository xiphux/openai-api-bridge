# Build and publish the bridge container image to GitHub Container Registry.
#
# Triggers
#   - push to main          -> publishes :main and :latest
#   - tag matching v*       -> publishes :v1.2.3, :1.2, :1, and :latest
#   - workflow_dispatch     -> manual run (no tag movement, just :sha-XXXXXXX)
#
# Pulls multi-arch (amd64 + arm64). Synology NASes split between Atom (amd64)
# and ARM models; CachyOS is amd64. Building both removes guesswork at deploy.
#
# Security note: every templated value below comes from a trusted GitHub
# context (repository name, actor login, action outputs, env vars) — none are
# user-controlled inputs that could carry injection payloads.

name: Build and publish container image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint & format (pre-commit)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Run tests
        run: uv run pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tagging strategy:
          #   - branch pushes              -> :main (or whatever the branch is)
          #   - PR builds                  -> :pr-N
          #   - semver tag pushes (v1.2.3) -> :1.2.3, :1.2, :1, AND :latest
          #   - every build                -> :sha-abc1234 for traceability
          # `:latest` is implicitly applied by metadata-action's default
          # flavor=latest=auto: it moves only on the highest semver tag, never
          # on branch pushes. Matches the convention used by postgres/nginx/etc.
          # — pull `:main` if you want the HEAD-of-default-branch image instead.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=openai-api-bridge
            org.opencontainers.image.description=OpenAI-compatible HTTP bridge for ComfyUI and Venice

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create a GitHub Release whenever a v*.*.* tag is pushed. Notes are
  # auto-generated from PRs/commits since the previous tag (categorization
  # is configured in `.github/release.yml`). Released as a draft so you can
  # review and optionally edit before publishing — flip `draft: false` once
  # you trust the auto-generated notes for your repo's flow.
  create-release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release object
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so release notes can compare to prior tag

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: true
          # Body is left blank so GitHub's auto-generation fills it in based
          # on `.github/release.yml`. To prepend a hand-written intro, set
          # `body:` here and GitHub appends the auto-generated notes after it.
