# Build and publish the bridge container image to GitHub Container Registry.
#
# Triggers
#   - push to main          -> publishes :main and :sha-XXXXXXX
#   - tag matching v*       -> publishes :1.2.3, :1.2, :1, and :latest
#   - workflow_dispatch     -> manual run of the same, for the chosen ref
#
# Pull requests don't run this workflow; ci.yml runs on them, and its image
# smoke job builds both architectures of the same Dockerfile.
#
# Pulls multi-arch (amd64 + arm64). Synology NASes split between Atom (amd64)
# and ARM models; CachyOS is amd64. Building both removes guesswork at deploy.
#
# Security note: every templated value below comes from a trusted GitHub
# context (repository name, actor login, action outputs, env vars) — none are
# user-controlled inputs that could carry injection payloads.

name: Build and publish container image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

# Read-only by default; `packages: write` is granted only to the job that
# pushes, so it never reaches the test jobs behind `tests`.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Gate everything on the full CI suite. A reusable workflow so the check
  # definitions live in one place; appears as nested jobs in the GitHub UI and
  # short-circuits build/release on any failure.
  tests:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    # The two-architecture build, arm64 under QEMU; generous, but not GitHub's
    # 6-hour default for a hung push or build.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tagging strategy:
          #   - branch pushes              -> :main (or whatever the branch is)
          #   - semver tag pushes (v1.2.3) -> :1.2.3, :1.2, :1, AND :latest
          #   - every build                -> :sha-abc1234 for traceability
          # `:latest` is implicitly applied by metadata-action's default
          # flavor=latest=auto: it moves only on the highest semver tag, never
          # on branch pushes. Matches the convention used by postgres/nginx/etc.
          # — pull `:main` if you want the HEAD-of-default-branch image instead.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=openai-api-bridge
            org.opencontainers.image.description=OpenAI-compatible HTTP bridge for ComfyUI and Venice

      # The layer cache is scoped by name so ci.yml's image smoke job can read
      # it. That job writes only to its own scopes, so a PR can never feed
      # layers into the image published here.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish

  # Create a GitHub Release whenever a v*.*.* tag is pushed, published rather
  # than drafted: a draft is invisible to everyone but the maintainer, and
  # twelve of them accumulated unnoticed behind that default.
  #
  # Notes come from scripts/release_notes.py, which reads the commits in the
  # tag. NOT GitHub's `generate_release_notes`, which lists pull requests only:
  # work here lands as direct commits to main, so v0.6.0's generated notes
  # named the two Dependabot PRs in it and none of the other 42 commits.
  create-release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # required to create the release object
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history + tags, so the notes can diff against the prior tag

      # No dependencies: the script is standard library only, so this needs no
      # uv sync. It fails the job rather than publishing an empty release.
      - name: Build release notes
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release_notes.py "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/notes.md
          draft: false
