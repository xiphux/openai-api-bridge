# CI — lint, type-check, tests and a secret scan.
#
# Triggers:
#   - Direct on push to any branch except `main`, Dependabot's, and tags.
#     Feature-branch pushes get feedback without a Docker publish riding along.
#     Dependabot branches are excluded because every one has a PR: the push run
#     would duplicate the `pull_request` run on the same commit, and the
#     `pull_request` run is the one that matters. Dependabot still opens those
#     branches for SECURITY updates, which is why the exclusion stays.
#   - Direct on every PR. Drives the PR checks UI.
#   - Indirect via `workflow_call` from docker.yml on `main` pushes and
#     `v[0-9]+.[0-9]+.[0-9]+` tags, so publishing is gated on exactly these
#     jobs. Both of those re-check content that has already been checked -- the `main` push
#     re-runs what the pull request ran, and the tag re-runs what the `main`
#     push ran over the same commit -- which is what `gate` below removes.
#
# Nothing keys on this workflow's NAME any more. dependabot-automerge.yml did,
# listening for `workflow_run` of a workflow named `CI`, and nothing — not
# even actionlint — flagged a mismatch, so a rename would have stopped
# auto-merge silently. Renovate merges through the platform instead.
name: CI

on:
  push:
    # renovate/** alongside dependabot/**: a bot branch lives in this
    # repository, so a push to it and the pull request it opens would each run
    # this workflow over the same tree -- every check reported, and paid for,
    # twice. The pull request run is the one that matters; it tests the merge.
    branches-ignore: [main, 'dependabot/**', 'renovate/**']
    tags-ignore: ['**']
  pull_request:
  workflow_call:

# Direct runs: one per ref, newest wins. Under `workflow_call` the `github`
# context is the caller's, so `github.workflow` is docker.yml's name there and
# the group falls back to the run id — unique, so a called run never cancels
# (or queues behind) another publish's tests.
concurrency:
  group: ${{ github.workflow == 'CI' && format('ci-{0}', github.ref) || github.run_id }}
  cancel-in-progress: true

# Nothing here writes to the repo or a registry. Under `workflow_call` this also
# caps what docker.yml's grant can reach in here.
permissions:
  contents: read

# Every job sets `timeout-minutes`, a few times its normal duration: GitHub's
# default is 6 hours, which is how long a hang would otherwise hold a runner
# (and a Dependabot PR's verdict).
jobs:
  # Has this exact content already gone green somewhere else? If so every
  # check below skips, because running them again would test the same bytes
  # a second time.
  #
  # Two ways that can be true, tried in order:
  #
  #   (1) THE SAME COMMIT — a release tag points at the commit `main` was
  #       already pushed with, so the run that checked `main` checked this.
  #       Identical SHA is the strongest evidence there is.
  #   (2) THE SAME TREE — on a `main` push, HEAD is the merge commit and its
  #       second parent is the branch that merged. Equal trees mean
  #       byte-identical checkouts, because a tree object hashes the complete
  #       recursive listing, every path, mode and blob, while saying nothing
  #       about lineage, message or commit hash. Equality also proves the
  #       branch was up to date when it merged: had `main` moved ahead, the
  #       merge would have folded those commits into the tree and the hashes
  #       would differ. So the case that must not inherit — a branch tested
  #       against an older `main`, merged onto a newer one, never tested in
  #       combination — is excluded by the comparison itself.
  #
  # They compose without overlapping: on a `main` push (1) finds nothing,
  # because a pull_request run reports the BRANCH head as its `head_sha`
  # rather than the merge commit, so it falls through to (2). On a tag (1)
  # answers at once.
  #
  # The two lookups name DIFFERENT workflows. This file never has a run of
  # its own on `main` or a tag — docker.yml calls it, and a called workflow
  # runs inside the caller's run — so the branch/tag evidence is a docker.yml
  # run, while the pull-request evidence is a run of this file.
  #
  # THE INVARIANT THAT MATTERS: at least one job here must not skip. A called
  # workflow whose jobs ALL skip concludes as *skipped*, and docker.yml's
  # `build-and-push` hangs off `needs: tests`, so that would skip the publish
  # and turn a release into a green run that shipped nothing. It cannot
  # happen: the checks skip only when `passed == 'true'`, and only a job that
  # RAN can emit that. So if `gate` skips, the checks run; if it runs, it is
  # itself the non-skipped job.
  #
  # Not on pull requests, deliberately. There the checkout is the merge ref —
  # itself a merge commit whose second parent is the branch head — so (2)
  # would compare a tree against the very branch under test and look up that
  # branch's own runs. A pull request must never certify itself. Because this
  # job can therefore skip, every check carries `!cancelled()`: without it a
  # skipped `gate` would skip the whole suite, since a plain expression does
  # not override the success-gating a skipped dependency imposes.
  #
  # Guarded at two levels. `continue-on-error` on the STEP stops a failed
  # lookup — a network error, an unparseable response — from failing the job;
  # the same key on the JOB stops a job-level death, in practice a runner that
  # never allocates, from failing the run. Neither bounds queue time, since
  # `timeout-minutes` does not start until a runner picks the job up. Nothing
  # depends on this job finishing usefully — the checks run regardless.
  #
  # Re-runs re-check for real: the script declines to inherit on attempt 2 and
  # above, so "Re-run all jobs" still means something.
  #
  # Staleness: an inherited pass asserts "identical content", not "identical
  # toolchain". The window is minutes for a merge; for a tag it is however
  # long sits between the merge and the release.
  gate:
    name: Check for an earlier pass
    if: >-
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
      # For the run lookups below.
      actions: read
    outputs:
      passed: ${{ steps.inherit.outputs.passed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its parents is all (2) needs. If a fetch ever
          # comes back without the second parent, `rev-parse` fails and the
          # step falls through to running the checks.
          fetch-depth: 2
          persist-credentials: false

      - name: Inherit a pass this content already earned
        id: inherit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAME_SHA_WORKFLOW: .github/workflows/docker.yml
          PR_WORKFLOW: .github/workflows/ci.yml
        run: |
          set -euo pipefail

          # A re-run is somebody asking for these checks to actually run.
          if [ "${GITHUB_RUN_ATTEMPT:-1}" != "1" ]; then
            echo "Attempt ${GITHUB_RUN_ATTEMPT:-1}: re-checking rather than inheriting."
            exit 0
          fi

          runs_for () {
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$1&per_page=100" \
              --jq "$2"
          }

          # Each lookup either sets `reason` or bows out, so there is exactly
          # one line below that can report a pass, however many ways there are
          # to earn one.
          reason=""

          # shellcheck disable=SC2016
          # The single quotes are the point: `$ENV.…` must reach jq
          # unexpanded, so that jq reads the value from the environment. A
          # shell expansion here would splice the value into the program text
          # instead, which is both wrong and the shape an injection would take.
          same_sha=$(runs_for "${GITHUB_SHA}" '
            [.workflow_runs[]
             | select(.path == $ENV.SAME_SHA_WORKFLOW
                      and (.id | tostring) != $ENV.GITHUB_RUN_ID)]
            | sort_by(.run_started_at) | last | .conclusion // empty')

          if [ "${same_sha}" = "success" ]; then
            reason="${GITHUB_SHA} has already been checked by an earlier run"
          else
            if ! pr_head=$(git rev-parse -q --verify 'HEAD^2'); then
              echo "No earlier run for ${GITHUB_SHA}, and HEAD is not a merge commit."
              exit 0
            fi

            head_tree=$(git rev-parse 'HEAD^{tree}')
            pr_tree=$(git rev-parse "${pr_head}^{tree}")

            if [ "${head_tree}" != "${pr_tree}" ]; then
              echo "Tree ${head_tree} differs from ${pr_head}'s ${pr_tree}."
              echo "The merge combined two lines nothing has tested together."
              exit 0
            fi

            # shellcheck disable=SC2016
            # Same reason as above.
            same_tree=$(runs_for "${pr_head}" '
              [.workflow_runs[]
               | select(.path == $ENV.PR_WORKFLOW
                        and .event == "pull_request")]
              | sort_by(.run_started_at) | last | .conclusion // empty')

            if [ "${same_tree}" != "success" ]; then
              echo "No successful run for ${pr_head} (got: ${same_tree:-none})."
              exit 0
            fi

            reason="the tree is identical to ${pr_head}, whose checks passed"
          fi

          echo "Inheriting: ${reason}."
          echo "passed=true" >> "${GITHUB_OUTPUT}"

  # Lint, format and type-check share a job: each takes seconds, and separate
  # jobs would each pay for their own checkout and `uv sync`.
  static:
    name: Lint + format + type-check
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      # --locked, not --frozen: fail if uv.lock no longer matches
      # pyproject.toml. --frozen installs the lock as-is without checking, so
      # a pyproject edit committed without `uv lock` would pass every job while
      # testing (and the Dockerfile shipping) the old resolution. Dependabot
      # edits both together; this is for hand edits. Once this step passes, the
      # --frozen runs below and in other jobs are installing a verified lock.
      - name: Install dependencies
        run: uv sync --locked

      # ruff (check + format, from uv.lock) and the file-hygiene hooks. The
      # gitleaks hook in there only warns on a runner; the `secrets` job below
      # is the real scan.
      - name: pre-commit
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

      # Strict mode, as configured in pyproject.toml. `!cancelled()` so a lint
      # nit doesn't hide a type error in the same run. This matters most for
      # Dependabot: pydantic, fastapi and starlette minors routinely change
      # their annotations without changing runtime behaviour tests would see.
      - name: mypy
        if: ${{ !cancelled() }}
        run: uv run --frozen mypy src

      # Declared-but-unused packages, and imports missing from the
      # declarations. Neither shows up anywhere else: an unused package still
      # installs, still ships in the image, and Dependabot keeps proposing
      # (and auto-merging) updates for it, while an undeclared import works
      # until whatever pulled it in stops. Its two recorded exceptions live in
      # [tool.deptry] in pyproject.toml, with the reasoning beside them.
      #
      # From the venv, like ruff and mypy: one version, in uv.lock, is what
      # both a local run and this job use. It also lets deptry read installed
      # metadata for the package-to-module mapping instead of guessing.
      - name: deptry
        if: ${{ !cancelled() }}
        run: uv run --frozen deptry .

  tests:
    name: Tests
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # --cov applies [tool.coverage] from pyproject.toml, including the
      # branch-coverage floor (fail_under), which fails this step on its own.
      - name: pytest
        run: uv run --frozen pytest -v --cov

  # Its own job rather than steps in `static`: it needs no `uv sync`, so it
  # finishes in seconds. actionlint catches workflow mistakes (bad expressions,
  # `needs` typos, shellcheck in `run:`); zizmor catches security ones
  # (unpinned actions, injection, permissions); hadolint catches Dockerfile
  # ones. Each tool's intentional exceptions live in its config
  # (.github/zizmor.yml, .hadolint.yaml), with reasons.
  infra:
    name: Workflow + Dockerfile lint
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release binary from GitHub, checksum-pinned, not the Docker Hub
      # image: anonymous Docker Hub pulls are rate-limited per IP on runners
      # shared with everyone else. It checks `run:` scripts with the runner
      # image's preinstalled shellcheck. Bump the version and checksum together
      # (from the release's checksums.txt).
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Online audits use the job's read-only token to verify that each SHA pin
      # is a real commit of the named repo and matches its `# vX.Y.Z` comment.
      # Annotations instead of SARIF upload: no `security-events: write` needed.
      # The action only runs zizmor versions in its own table (pulled by digest),
      # so `version` must be one the pinned action release knows: bumping zizmor
      # past it fails with "Unknown version" until the action is bumped too.
      - name: zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

      # Picks up .hadolint.yaml from the mounted repo root. Pinned by digest, and
      # pulled from GHCR rather than Docker Hub for the same reason as actionlint.
      - name: hadolint
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          hadolint Dockerfile

      # CHANGELOG.md is the sole source of release notes, so a malformed one is
      # a release that publishes nothing. Checks the structure only (headings
      # are Unreleased or vX.Y.Z, newest first, no released version left empty);
      # whether an entry is WORTH writing is a review question, not a CI one.
      # Lives here rather than in `static` because it needs no uv sync.
      - name: Changelog
        if: ${{ !cancelled() }}
        run: python3 scripts/release_notes.py --validate

  # A known vulnerability in anything the image ships fails the run, so an
  # auto-merged update can't bring one in unnoticed — and neither can an
  # advisory published against something already locked, which holds every
  # Dependabot PR until it's dealt with, on purpose. (The PR that bumps the
  # affected package past the fix passes, since it's audited on its own tree.)
  #
  # --no-dev because dev dependencies never reach the image. pip-audit has no
  # severity threshold, so this fails on any advisory with a known ID; if one
  # is reviewed and found unreachable here, add `--ignore-vuln <ID>` below with
  # the reasoning beside it, rather than dropping the job.
  #
  # Audits the exported, hash-pinned lock, not an environment: `--disable-pip`
  # with `--require-hashes` resolves nothing, so it checks exactly uv.lock.
  audit:
    name: Dependency audit
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: nothing is installed but pip-audit itself.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Export production dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"

      # Pinned; bump by hand (Dependabot doesn't see a uvx version).
      - name: pip-audit
        run: >-
          uvx pip-audit@2.10.1
          -r "$RUNNER_TEMP/requirements.txt"
          --require-hashes --disable-pip --progress-spinner off

  # Build the runtime image and boot it. Every other job runs a full dev install
  # on glibc; the image installs `--no-dev` on Alpine/musl. A runtime import of
  # a dev-only package (httpx is one, on purpose), or a native dependency
  # release that drops its musllinux wheel, passes every other job and breaks
  # the shipped image — and Dependabot auto-merges before docker.yml ever
  # builds. tests/image-smoke/run.sh boots the container, and smoke.py does
  # real work with each runtime dependency from the image's own venv. Runnable
  # locally the same way.
  #
  # Both architectures build, since Python's native wheels are per-arch and an
  # arm64-only gap is plausible. amd64 boots and serves; arm64 runs the import
  # and native-extension checks under QEMU, which is slow for a server but
  # fine for a few seconds of imports.
  #
  # Cache: reads docker.yml's `publish` scope so a warm build is quick, but
  # writes only to its own scopes, so a PR run can never feed layers into the
  # image docker.yml publishes.
  image:
    name: Docker image smoke
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build runtime image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: openai-api-bridge:ci-amd64
          cache-from: |
            type=gha,scope=publish
            type=gha,scope=ci-image-amd64
          cache-to: type=gha,mode=max,scope=ci-image-amd64

      - name: Build runtime image (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: openai-api-bridge:ci-arm64
          cache-from: |
            type=gha,scope=publish
            type=gha,scope=ci-image-arm64
          cache-to: type=gha,mode=max,scope=ci-image-arm64

      - name: Boot and smoke-test the image (amd64)
        run: tests/image-smoke/run.sh openai-api-bridge:ci-amd64

      - name: Import-check the image (arm64)
        if: ${{ !cancelled() }}
        run: tests/image-smoke/run.sh --imports-only openai-api-bridge:ci-arm64 linux/arm64

  # Backstop for the pre-commit hook, which only runs where gitleaks is
  # installed and is skipped by `--no-verify` (and never runs for Dependabot's
  # commits). GitHub secret scanning and push protection also cover this public
  # repo; this is the check that fails a PR.
  #
  # Scans the full history of the commit under test, not just the new commits:
  # at this repo's size that takes under a second, and it needs no base-ref
  # logic that differs between push, PR and workflow_call.
  secrets:
    name: Secret scan
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Pinned by digest, and Dependabot doesn't see a `docker run`, so bump the
      # tag and digest together by hand. --redact keeps a real hit out of the
      # (public) job log. --log-opts=HEAD scans the history of the commit under
      # test only: gitleaks defaults to `git log --all`, and fetch-depth 0
      # fetches every remote branch, so a finding on some stale, unrelated
      # branch would otherwise fail every PR. Reviewed false positives:
      # .gitleaksignore (history) and inline `gitleaks:allow` (current tree).
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --redact --no-banner --verbose --log-opts=HEAD
