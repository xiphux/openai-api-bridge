# Weekly upgrade to-do list, as GitHub issues rather than PRs: one open issue
# per available major upgrade of a direct dependency
# (scripts/major_upgrade_issues.py), closed once uv.lock is on the latest
# major. Dependabot ignores uv majors (see dependabot.yml): it proposes only a
# package's newest version, so a pending major would replace that package's
# minor and patch updates, and every held major would also occupy one of its
# five open-PR slots.
#
# Runs from the default branch on a schedule, and checks out nothing but this
# repo's own trusted code.
name: Upgrade check

on:
  schedule:
    - cron: '0 14 * * 1' # 14:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: a weekly run gains little from one, and zizmor rightly
      # flags caches in workflows holding a write token.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      # `uv pip list` reads the installed versions, so the locked environment
      # has to exist. Dev dependencies included: they're direct dependencies
      # Dependabot proposes too.
      - name: Install dependencies
        run: uv sync --frozen

      # An empty or unreadable report fails the script, so an index error here
      # can't read as "nothing is outdated".
      - name: List outdated packages
        run: uv pip list --outdated --format json > "$RUNNER_TEMP/outdated.json"

      # PyYAML pinned rather than borrowed from the project venv, where it is
      # only a transitive dependency of uvicorn[standard].
      - name: Open, update and close major-upgrade issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run --no-project --with pyyaml==6.0.3
          python scripts/major_upgrade_issues.py "$RUNNER_TEMP/outdated.json"
