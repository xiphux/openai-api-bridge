# Three ecosystems, all reviewed through the same gate: dependabot-automerge.yml
# merges a PR only once CI is green AND every update in it is semver-safe (see
# that file for the rule). Anything else — a major, a 0.x minor (bar a short
# allowlist there), a prerelease — stays open for a human.
#
# Security updates are a separate repo setting (enabled), not configured here;
# `cooldown` does not delay them, and `ignore` update-types don't apply to
# them, so a security fix that needs a major still arrives as a PR.
version: 2
updates:
  # Keep GitHub Actions pins current. Every action is pinned to a commit SHA
  # (see ci.yml), which goes stale silently; Dependabot updates the SHA and the
  # trailing `# vX.Y.Z` comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Daily, so a release is proposed the day its cooldown ends rather than up
      # to a week later; cooldown still sets how soon a given release can land.
      # A scheduled run does NOT rebase a PR the auto-merge workflow held for
      # being behind main — only a conflict or `@dependabot rebase` does (see
      # the header of dependabot-automerge.yml).
      interval: daily
    commit-message:
      prefix: ci
    # A hijacked action tag is usually caught and pulled within days; a week
    # keeps a fresh compromise from reaching a SHA pin automatically.
    cooldown:
      default-days: 7
    # The default is 5 per entry, and ci.yml pins eleven distinct actions.
    # Version updates over the limit are not opened until a slot frees;
    # security updates are never counted against it.
    open-pull-requests-limit: 10

  # pyproject.toml + uv.lock. Direct dependencies only; a transitive one moves
  # when a direct one needs it to, or through a security update.
  - package-ecosystem: uv
    directory: /
    schedule:
      # Daily, for the same reason as above.
      interval: daily
    commit-message:
      prefix: deps
      prefix-development: deps(dev)
    # Above the default 5: sixteen direct dependencies between the project
    # and its dev group, released in cooldown batches, and four update PRs
    # were open at once as this was written. A version update over the limit
    # is not opened until a slot frees; security updates are exempt.
    open-pull-requests-limit: 10
    # A week, for supply-chain reasons: most malicious PyPI publishes are found
    # and yanked within days, and most of these PRs merge unattended. Security
    # updates ignore cooldown and still arrive at once.
    cooldown:
      default-days: 7
    # Packages that must move in lockstep share a PR, so CI never sees half a
    # family bumped. Kept narrow on purpose: a group is held for review if ANY
    # member is, so a broad group would park unrelated patches behind one risky
    # minor. `update-types` keeps a security PR that needs a major out of a
    # group, so it arrives on its own, to be reviewed on its own. Groups also
    # name the issues upgrade-check.yml opens for majors.
    groups:
      respx:
        # The test mocking stack (see the DEFAULT_MOCKER note in
        # tests/conftest.py): pytest-httpx2 registers respx's httpcore2 mocker,
        # and respx still builds its mocks from httpx v1 types.
        patterns:
          - respx
          - httpx
          - pytest-httpx2
        update-types: [minor, patch]
    ignore:
      # Majors are upgraded on purpose, by hand, not proposed daily. Ignored
      # rather than proposed-and-held because Dependabot offers only a package's
      # newest version: a pending major would take the place of that package's
      # minor and patch updates, and each held major would occupy one of the
      # five open-PR slots. workflows/upgrade-check.yml opens an issue per major
      # instead.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # .pre-commit-config.yaml's `rev:` pins (pre-commit-hooks; ruff and gitleaks
  # are local hooks, so nothing else is pinned there). Majors are NOT ignored
  # here: upgrade-check.yml only reads uv, so a held PR is the only notice a
  # hook major would get, and with one pinned repo it can't crowd anything out.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
