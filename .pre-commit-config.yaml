repos:
  # Generic file-level checks (no language dependency)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  # Ruff: lightning-fast Python linter + formatter (matches pyproject.toml config)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff # linter (pycodestyle, pyflakes, isort, bugbear, etc.)
        args: [--fix]
      - id: ruff-format # formatter (like Prettier)
