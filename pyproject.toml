[project]
name = "openai-api-bridge"
version = "0.5.0"
description = "OpenAI-compatible HTTP bridge for ComfyUI and Venice image/video generation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Han", email = "chris@chrishan.me" }]
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22.1",
  "fastapi>=0.136.1",
  "httpx>=0.28.1",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "python-multipart>=0.0.31",
  "uvicorn[standard]>=0.46.0",
]

[project.urls]
# These get baked into the wheel's METADATA and (via the "Source" URL) make
# the GHCR package page auto-link to the repo on first publish.
Homepage = "https://github.com/xiphux/openai-api-bridge"
Repository = "https://github.com/xiphux/openai-api-bridge"
Issues = "https://github.com/xiphux/openai-api-bridge/issues"

[project.scripts]
openai-api-bridge = "openai_api_bridge.main:run"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy>=2.0.0",
  "pre-commit>=4.0.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "respx>=0.23.1",
  "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",   # pycodestyle / pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # comprehensions
  "SIM", # simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501", # line length handled by formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: tests that require live ComfyUI and/or Venice (opt-in via -m live)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
