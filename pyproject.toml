[project]
name = "openai-api-bridge"
version = "0.6.0"
description = "OpenAI-compatible HTTP bridge for ComfyUI and Venice image/video generation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Han", email = "chris@chrishan.me" }]
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22.1",
  "fastapi>=0.141.1",
  "httpx2>=2.10.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "python-multipart>=0.0.32",
  # Imported directly by api/_limits.py, which is a pure ASGI middleware:
  # starlette's Headers/JSONResponse and its ASGIApp/Message/Receive/Scope/Send
  # types, which FastAPI does not re-export. It arrives through FastAPI either
  # way, but a direct import is a direct dependency — declared, it is one
  # FastAPI could stop pulling in without taking this with it, and one
  # Dependabot tracks in its own right.
  "starlette>=1.6.0",
  "uvicorn[standard]>=0.52.1",
]

[project.urls]
# These get baked into the wheel's METADATA and (via the "Source" URL) make
# the GHCR package page auto-link to the repo on first publish.
Homepage = "https://github.com/xiphux/openai-api-bridge"
Repository = "https://github.com/xiphux/openai-api-bridge"
Issues = "https://github.com/xiphux/openai-api-bridge/issues"

[project.scripts]
openai-api-bridge = "openai_api_bridge.main:run"

[build-system]
requires = ["uv_build>=0.11.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "deptry>=0.25.1",
  # respx mocks by patching httpcore, one layer below httpx, so it still
  # authors mocks in httpx v1 types even when the traffic it intercepts is
  # httpx2 — `return_value=` rejects an httpx2.Response outright
  # (lundberg/respx#324). Tests therefore import both on purpose: httpx to
  # build what respx returns, httpx2 for objects handed straight to src.
  "httpx>=0.28.1",
  "mypy>=2.3.0",
  "pre-commit>=4.0.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  # For tests/test_ci_workflow.py, which parses the workflow files to
  # assert the CI gate cannot report a pass it did not earn. The
  # comment under [tool.deptry] about PyYAML concerns scripts/, which
  # runs outside this environment on purpose; a test runs inside it.
  "pyyaml>=6.0.2",
  # mypy runs strict over tests/ too, and yaml ships no inline types.
  "types-PyYAML>=6.0.12",
  # Registers respx's httpcore2 mocker; see the DEFAULT_MOCKER note in
  # tests/conftest.py for why that one line replaces 347 call-site edits.
  "pytest-cov>=7.1.0",
  "pytest-httpx2>=1.0.0",
  "respx>=0.23.1",
  # 0.16 expanded the default rule set and started formatting Python blocks in
  # Markdown. pre-commit and CI both run this ruff from uv.lock (see
  # .pre-commit-config.yaml), so the floor only keeps a re-lock from going back.
  "ruff>=0.16.2",
]

# Dependencies declared but unused, and imports missing from the declarations.
# Neither is visible any other way: an unused package still installs, still
# ships in the image, and Dependabot goes on proposing updates for it, while an
# undeclared import works right up until whatever was pulling it in stops.
[tool.deptry]
# scripts/ is not run against this project's environment. upgrade-check.yml
# invokes major_upgrade_issues.py with `uv run --no-project --with pyyaml==...`,
# supplying its dependencies at the call site on purpose (the comment there
# explains why PyYAML is not borrowed from the venv). Scanning it would report
# that deliberate arrangement as a missing dependency.
extend_exclude = ["scripts"]

[tool.deptry.per_rule_ignores]
# FastAPI parses multipart bodies with python-multipart but never exposes it:
# nothing imports the name, so DEP002 reads it as unused. It is required —
# /v1/images/edits binds UploadFile/File()/Form() (api/images.py), and FastAPI
# raises at startup without it.
DEP002 = ["python-multipart"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",   # pycodestyle / pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # comprehensions
  "SIM", # simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501", # line length handled by formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Strict config/markers: a typo in this table or a mark fails instead of being
# ignored.
addopts = ["--strict-config", "--strict-markers"]
# Any warning fails the suite. Dependabot auto-merges minors on a green run, and
# a minor that deprecates something the bridge uses warns before the major that
# removes it; failing on it holds that update for a human instead. A warning
# reviewed and judged harmless gets a narrow `ignore::` entry here, with why.
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: tests that require live ComfyUI and/or Venice (opt-in via -m live)",
]

# Read only when pytest runs with --cov (CI's `tests` job, or
# `uv run pytest --cov` locally); a plain `uv run pytest` skips coverage.
[tool.coverage.run]
source = ["openai_api_bridge"]
branch = true

[tool.coverage.report]
# A floor, not a target: CI fails if total branch coverage drops below it.
# Raise it when coverage rises, so it holds new ground; never lower it to get
# a change through — cover the change instead.
fail_under = 92
skip_covered = true
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
