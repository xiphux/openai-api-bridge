[project]
name = "openai-api-bridge"
version = "0.6.0"
description = "OpenAI-compatible HTTP bridge for ComfyUI and Venice image/video generation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Han", email = "chris@chrishan.me" }]
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22.1",
  "fastapi>=0.141.1",
  "httpx2>=2.10.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "python-multipart>=0.0.32",
  "uvicorn[standard]>=0.52.1",
]

[project.urls]
# These get baked into the wheel's METADATA and (via the "Source" URL) make
# the GHCR package page auto-link to the repo on first publish.
Homepage = "https://github.com/xiphux/openai-api-bridge"
Repository = "https://github.com/xiphux/openai-api-bridge"
Issues = "https://github.com/xiphux/openai-api-bridge/issues"

[project.scripts]
openai-api-bridge = "openai_api_bridge.main:run"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  # respx mocks by patching httpcore, one layer below httpx, so it still
  # authors mocks in httpx v1 types even when the traffic it intercepts is
  # httpx2 — `return_value=` rejects an httpx2.Response outright
  # (lundberg/respx#324). Tests therefore import both on purpose: httpx to
  # build what respx returns, httpx2 for objects handed straight to src.
  "httpx>=0.28.1",
  "mypy>=2.3.0",
  "pre-commit>=4.0.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  # Registers respx's httpcore2 mocker; see the DEFAULT_MOCKER note in
  # tests/conftest.py for why that one line replaces 347 call-site edits.
  "pytest-httpx2>=1.0.0",
  "respx>=0.23.1",
  # 0.16 expanded the default rule set and started formatting Python blocks in
  # Markdown; the floor keeps local runs matching the pinned pre-commit hook.
  "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",   # pycodestyle / pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # comprehensions
  "SIM", # simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501", # line length handled by formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: tests that require live ComfyUI and/or Venice (opt-in via -m live)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
